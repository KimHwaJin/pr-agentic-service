# Values shared by every environment (copied into the image). On top of it:
# config.{APP_ENV}.yml for dev/stg/prd, and locally (APP_ENV empty) the
# docker-compose.yml environment or .env. Precedence: environment > .env >
# config.{APP_ENV}.yml > this file. Keep environment-specific values out.
REDIS_NAMESPACE: agentic

SSO_ADAPTER: company
SSO_ADAPTER_FACTORY: "company_sso:create_sdk"
SSO_ALLOWED_RETURN_ROOTS: ["/"]
COOKIE_SECURE: true

LLM_BASE_URL: http://model.frodo.com/v1
LLM_ENABLE_THINKING: false
EMBEDDING_PROVIDER: none

STORAGE_ROOT: /mnt/data/agent/pr-agentic-service
STORAGE_EXECUTOR_PATH: pr-agentic-service
EXECUTOR_RESULT_ROOT: /mnt/data/executor
EXECUTOR_RUNTIME_PROFILE: default
NOTEBOOK_LAB_BASE_URL: https://executor-jupyter-lab.frodo.com

# RS256 signing key for pr-batch, copied into keys/ before the image build
# (keys/README.md); never committed. iss/aud match pr-batch.
BATCH_JWT_PRIVATE_KEY_FILE: keys/auth_private.pem
BATCH_JWT_ISSUER: batch-client
BATCH_JWT_AUDIENCE: batch-service
