# Local stack on top of the already running shared infrastructure:
#   - shared-infra compose: postgres, redis (network "shared-infra")
#   - executor compose: executor API + Jupyter runtimes (also on "shared-infra" as host "executor")
#   - pr-batch compose (optional, for the 배치 page): API on the host port 8100
#     (BATCH_BASE_URL below; keys/auth_private.pem is a copy of
#     ../pr-batch/.local-keys/auth_private.pem)
#
#   docker compose up -d --build            # service at http://localhost:8080 (console: /dev/)
#   docker compose --profile mock up -d     # + scripted mock LLM instead of the gateway
#
# APP_ENV stays empty: config.yml (shared values) + the local values below; a .env next to this compose fills the ${...} values below.
name: pr-agentic-service

x-app-env: &app-env
  # Local values on top of config.yml (shared, mounted below); they win over
  # it. Edits here apply on `docker compose up -d`.
  RUN_MODE: all
  DATABASE_URL: postgresql+psycopg://${PG_USER:-executor}:${PG_PASSWORD:-executor}@postgres:5432/${PG_DB:-agentic}
  REDIS_URL: redis://redis:6379/0
  SSO_ADAPTER: dev
  PUBLIC_API_ORIGIN: http://localhost:${APP_PORT:-8080}
  FRONTEND_ORIGIN: http://localhost:${APP_PORT:-8080}
  SSO_ALLOWED_RETURN_ROOTS: '["/", "/dev"]'
  COOKIE_SECURE: "false"
  LLM_API_KEY: ${LLM_API_KEY:-EMPTY}
  EMBEDDING_PROVIDER: mock
  EMBEDDING_DIMS: "1024"
  EXECUTOR_BASE_URL: http://executor:8000
  # executor INPUT_STORAGE_ROOT = SHARED_STORAGE_ROOT = ../executor/shared_dir
  STORAGE_ROOT: /mnt/executor-shared/agentic
  STORAGE_EXECUTOR_PATH: agentic
  EXECUTOR_RESULT_ROOT: /mnt/executor-shared
  # Worker reads only the Redis stream executor.events.<EXECUTOR_TENANT_ID>.
  EXECUTOR_TENANT_ID: pr-agentic
  NOTEBOOK_LAB_BASE_URL: http://localhost:8888
  # pr-batch compose (../pr-batch) on the host port 8100; it verifies with the
  # pair from its `make auth-keys`, keys/auth_private.pem is a copy of the
  # private half (config.yml batch_jwt_private_key_file).
  BATCH_BASE_URL: http://host.docker.internal:8100
  # Test catalog on top of assets/ (catalogs/analysis_test/README.md); set
  # '[]' to go back to the base catalog.
  CATALOG_EXTENSIONS: '["catalogs/analysis_test"]'
  # Chat models (exactly one default). Only qwen38-27b-nvfp4 is served on the
  # local gateway. Per-model request fields go in "params", e.g.
  # {"chat_template_kwargs": {"enable_thinking": false}}.
  MODELS: '[{"name": "qwen38-27b-nvfp4", "label": "Qwen 3.8 27B", "default": true, "input": ["text", "image"], "max_images": 8}]'
  # Phoenix tracing (optional, docs/phoenix-tracing.md): set these in .env
  PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT:-}
  PHOENIX_API_KEY: ${PHOENIX_API_KEY:-}
  PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-pr-agentic-service-local}

services:
  db-init:
    # Creates the service database on the shared Postgres once (idempotent).
    image: pgvector/pgvector:pg17
    environment:
      PGPASSWORD: ${PG_PASSWORD:-executor}
    command: >
      sh -c "psql -h postgres -U ${PG_USER:-executor} -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname='${PG_DB:-agentic}'\" | grep -q 1
      || psql -h postgres -U ${PG_USER:-executor} -d postgres -c 'CREATE DATABASE ${PG_DB:-agentic}'"
    networks: [shared-infra]
    restart: "no"

  app:
    build: .
    image: pr-agentic-service:local
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment: *app-env
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      # Agent/Executor shared volume: PATH sources we write, step results the executor writes.
      - ${EXECUTOR_SHARED_DIR:-../executor/shared_dir}:/mnt/executor-shared
      # Skills/tools/knowledge and prompts are read live, so edits apply without a rebuild.
      - ./assets:/app/assets:ro
      - ./catalogs:/app/catalogs:ro
      - ./src/agent/prompts:/app/src/agent/prompts:ro
      - ./web:/app/web:ro
      - ./config.yml:/app/config.yml:ro
      # pr-batch signing key (keys/README.md), read without a rebuild.
      - ./keys:/app/keys:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"  # pr-batch on the host port
      - "model.frodo.com:10.250.110.99"
      - "phoenix.frodo.com:10.250.110.100"  # Phoenix tracing (optional)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/readyz')"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [shared-infra]
    restart: unless-stopped

  mock-llm:
    profiles: [mock]
    image: pr-agentic-service:local
    command: ["uvicorn", "mock_llm:app", "--app-dir", "scripts", "--host", "0.0.0.0", "--port", "8001"]
    volumes:
      - ./scripts:/app/scripts:ro
      - ./tests/fixtures:/app/tests/fixtures:ro
    networks: [shared-infra]

networks:
  shared-infra:
    external: true
