# =============================================================================
# config.example.yml : pr-agentic-service의 모든 설정값 안내서
# =============================================================================
# 이 파일은 읽히지 않습니다(참고용). 서비스가 실제로 읽는 곳은 아래뿐입니다.
#
#   config.yml               모든 환경 공통값 (이미지에 포함)
#   config.{APP_ENV}.yml     환경별 값 (APP_ENV = dev | stg | prd)
#   .env / 환경변수          로컬 값, 급한 덮어쓰기 (Deployment env:, compose environment:)
#
# 우선순위 (높음 → 낮음): 환경변수 > .env > config.{APP_ENV}.yml > config.yml
#                         > 코드 기본값 (src/dtest/core/config.py 의 Settings)
#
# 규칙
# - 키 이름은 Settings 필드 이름의 대문자입니다 (대소문자 무관).
# - 환경변수/.env 로 줄 때 목록·객체는 JSON 으로 씁니다.
#   예) CORS_ORIGINS='["https://front.example.com"]'
# - 상대 경로는 레포 루트 기준입니다 (실행 위치 무관).
# - 아래 "값"은 config.yml 에 실제로 들어 있는 공통값이거나(공통 항목),
#   형식을 보여 주는 예시입니다(환경별 항목, <...> 자리). 코드 기본값이 다르면
#   "기본값:" 으로 따로 적었습니다.
# - <...> 자리표시자가 남아 있으면 APP_ENV 가 있는 환경에서는 기동하지 않습니다.
# - 비밀값(키, 비밀번호)은 절대 여기에 실제 값을 쓰지 마세요.
#
# 표시
#   [공통]   config.yml 에 둠        [환경별] config.{APP_ENV}.yml 에 둠
#   [비밀]   가능하면 Deployment env: 로 주입
#
# 이 파일이 Settings 필드를 빠짐없이 담고, 공통값이 config.yml 과 같은지는
# tests/test_config_files.py 가 확인합니다. Settings 에 필드를 추가하면 여기에도
# 설명과 함께 추가하세요.


# -----------------------------------------------------------------------------
# 1. 데이터베이스 / Redis
# -----------------------------------------------------------------------------

# [환경별][비밀] 서비스 PostgreSQL 접속 URL (pgvector 확장 필요).
# SQLAlchemy 형식(postgresql+psycopg://), 체크포인터는 같은 DB 를 psycopg 로 씀.
# 기본값: postgresql+psycopg://postgres:postgres@localhost:5432/agentic
DATABASE_URL: postgresql+psycopg://<user>:<password>@<pg-host>:5432/agentic

# [환경별] Redis URL. 실행 완료 이벤트를 받으려면 executor 가 이벤트를 쓰는
# Redis 와 같아야 합니다(run 깨우기, 락, 캐시에도 사용).
# 기본값: redis://localhost:6379/0
REDIS_URL: redis://<redis-host>:6379/0

# [공통] Redis 키 앞에 붙는 접두어. 같은 Redis 를 쓰는 다른 서비스와 키 충돌 방지.
REDIS_NAMESPACE: agentic

# [공통] 앱 테이블용 SQLAlchemy 커넥션 풀 크기(같은 수만큼 overflow 허용).
# PG(max_connections 100)를 executor, pr-batch 와 나눠 쓰므로 작게 유지.
# pod 당 PG 연결 = DB_POOL_SIZE*2 + CHECKPOINT_POOL_SIZE (docs/load-design.md)
DB_POOL_SIZE: 3

# [공통] LangGraph 체크포인터/스토어의 psycopg 풀 크기 (2 이상).
# 실행 중인 모든 턴의 그래프 스텝이 이 풀로 체크포인트를 씀.
CHECKPOINT_POOL_SIZE: 8

# [공통] 체크포인트 쓰기가 빈 커넥션을 기다리는 최대 시간(초, 0 초과).
CHECKPOINT_POOL_TIMEOUT_SECONDS: 30

# [공통] 체크포인트 풀 연결의 TCP keepalive 첫 신호까지 걸리는 시간(초, 1 이상).
# k8s와 DB 사이 장비(LB, 방화벽, NAT)가 idle 연결을 끊는 시간보다 짧게 둔다.
DB_KEEPALIVE_IDLE_SECONDS: 60

# [공통] 기동 시 alembic 마이그레이션 자동 적용 여부.
AUTO_MIGRATE: true

# [공통] /docs(Swagger), /redoc, /openapi.json 노출 여부.
# 내부망 규정상 dev/stg/prd 모두 false, docker compose 로컬만 true.
DOCS_ENABLED: false

# [환경별] 웹 화면(/dev/) 노출 여부. 비우면(null) local·dev만 켜짐.
# prd는 오픈 전 통합테스트 동안 true(config.prd.yml), 오픈 때 false로 바꿈.
WEB_CONSOLE_ENABLED: null


# -----------------------------------------------------------------------------
# 2. 주소 / CORS / 로그인(SSO) / 쿠키
# -----------------------------------------------------------------------------

# [환경별] 브라우저가 여는 이 API 서버의 origin (scheme://host[:port]).
# SSO 콜백 URL 을 만들 때 씀. 기본값: http://localhost:8080
PUBLIC_API_ORIGIN: https://<api-host>

# [환경별] 프론트(웹 화면) origin. 로그인 후 돌아갈 주소의 기준.
# 기본값: http://localhost:8080
FRONTEND_ORIGIN: https://<front-host>

# [환경별] CORS 허용 origin 목록. 프론트가 다른 출처일 때만 채움. 기본값: []
CORS_ORIGINS: ["https://<front-host>"]

# [환경별] SSO 로그인 페이지로 허용하는 origin 목록 (scheme://host).
# 비어 있으면 SSO_ADAPTER=idp 일 때 모든 로그인이 502 (APP_ENV 가 있으면 기동 거부).
# 거부된 origin 은 sso_login_url_rejected origin=... 로 로그에 남음. 기본값: []
SSO_ALLOWED_ORIGINS: ["https://<sso-host>"]

# [환경별] 세션 쿠키에 Secure 속성. https 환경은 true.
# stg/prd 에서 false 면 기동 거부. 로컬(http)은 false. 기본값: false
COOKIE_SECURE: true

# [환경별] 관리자 역할을 줄 사번 목록 (SSO 가 보내는 사번 그대로).
# 사용자의 "첫 로그인" 때만 부여되므로 관리자가 처음 로그인하기 전에 채울 것.
# 비어 있으면 경고 로그(admin_employee_ids_empty). 기본값: []
ADMIN_EMPLOYEE_IDS: ["<employee-id>"]

# [공통] 로그인 방식. idp = 사내 SSO, dev = 고정 사번으로 바로 로그인(로컬 전용,
# APP_ENV 가 있으면 기동 거부). 기본값: dev (config.yml 은 idp)
SSO_ADAPTER: idp

# [공통] SSO_ADAPTER=idp 일 때 SSO SDK 를 만드는 함수 "모듈:함수".
# 기본 구현은 src/dtest/idp_login.py (main 브랜치: idp_login:create_sdk). 기본값: ""
SSO_ADAPTER_FACTORY: "src.dtest.idp_login:create_sdk"

# [공통] 로그인 후 돌아갈 수 있는 경로 접두어 목록 (오픈 리다이렉트 방지).
# 로컬은 /dev 테스트 콘솔도 넣음: ["/", "/dev"]
SSO_ALLOWED_RETURN_ROOTS: ["/"]

# [공통] 로그인 세션 쿠키 이름.
SESSION_COOKIE_NAME: agentic_session

# [공통] 세션 쿠키 SameSite 속성: lax | strict | none (none 은 브라우저상 COOKIE_SECURE=true 필요).
COOKIE_SAMESITE: lax

# [공통] 로그인 세션 유휴 만료(초, 60~86400). 활동하면 연장됨(슬라이딩).
SESSION_TTL_SECONDS: 1800

# [공통] 로그인 후 세션 최대 수명(초, 300~604800). SESSION_TTL_SECONDS 이상이어야 함.
SESSION_MAX_SECONDS: 43200

# [공통] 로그인 시작부터 SSO 콜백까지 기다리는 시간(초, 60~1800).
LOGIN_FLOW_TTL_SECONDS: 300

# [공통] 로그인 경로(/auth/login/sso, 콜백)의 클라이언트 IP당 분당 호출 한도. 넘으면 429. 0이면 제한 없음.
SSO_RATE_LIMIT_PER_MINUTE: 30

# [공통] SSO_ADAPTER=dev 일 때 로그인되는 고정 사번과 이름 (로컬 전용).
DEV_EMPLOYEE_ID: dev0001
DEV_EMPLOYEE_NAME: 개발자


# -----------------------------------------------------------------------------
# 3. 서비스 간 인증 (docs/specs/service-auth.md)
#    브라우저 외의 호출자는 항상 X-Api-Key(시스템 페이지에서 발급한 api client 키)
#    + X-User-Id 를 보냄. 키 없는 모드는 어느 환경에도 없음 (2026-11-01).
# -----------------------------------------------------------------------------

# [공통] 검증된 호출자 키를 캐시하는 시간(초, 0~300). 키 폐기가 반영되는 지연.
API_CLIENT_CACHE_SECONDS: 60

# [공통] 다른 tenant 키 호출자의 X-User-Id(SSO 사번) 형식 정규식
# (소문자로 바꾼 뒤 전체 일치). 비우면 형식 검사만. 잘못된 정규식이면 기동 실패.
# 예) "^[a-z]{1,3}[0-9]{5,8}$"
EMPLOYEE_ID_PATTERN: ""

# [공통] 이 접두어로 시작하는 X-User-Id 는 시스템 계정으로 보고 위 정규식을 건너뜀.
SERVICE_USER_PREFIX: svc-


# -----------------------------------------------------------------------------
# 4. LLM 게이트웨이 / 모델 목록 (OpenAI 호환, vLLM)
# -----------------------------------------------------------------------------

# [공통] OpenAI 호환 게이트웨이 주소 (/v1 까지). 기본값: http://localhost:8001/v1
LLM_BASE_URL: http://model.frodo.com/v1

# [환경별][비밀] 게이트웨이 API 키. 키가 필요 없는 vLLM 은 EMPTY. 기본값: EMPTY
LLM_API_KEY: <llm-api-key>

# [환경별] 사용자에게 제공하는 채팅 모델 목록. 정확히 하나만 DEFAULT: true,
# NAME 중복 불가. 기본값: [{NAME: default, DEFAULT: true}]
#   NAME        게이트웨이의 served model name (요청의 "model" 값)
#   LABEL       화면 표시 이름 (생략하면 NAME)
#   DEFAULT     기본 모델 여부
#   INPUT       [text] 또는 [text, image] (이미지는 비전 모델만)
#   MAX_IMAGES  한 턴에 보낼 수 있는 이미지 수 (0~32, 기본 0)
#   PARAMS      이 모델 요청 본문에만 그대로 붙는 값 (키는 적힌 그대로 전달,
#               API 응답에는 나가지 않음). LLM_ENABLE_THINKING 위에 덮임.
MODELS:
  - NAME: <model-name>
    LABEL: <display name>
    DEFAULT: true
    INPUT: [text]
  # 예) 비전 모델, 모델별 요청 파라미터
  # - NAME: example-vl-model
  #   LABEL: 예시 비전 모델
  #   INPUT: [text, image]
  #   MAX_IMAGES: 8
  # - NAME: gpt-oss-120b
  #   PARAMS:
  #     reasoning_effort: low
  #     chat_template_kwargs: {enable_thinking: false}

# [공통] 생성 temperature.
LLM_TEMPERATURE: 0.2

# [공통] LLM 호출 하나의 타임아웃(초).
LLM_TIMEOUT_SECONDS: 120.0

# [공통] chat_template_kwargs.enable_thinking 으로 보낼 값.
# true/false 면 모든 요청에 넣고, null 이면 보내지 않음. 기본값: null
LLM_ENABLE_THINKING: false


# -----------------------------------------------------------------------------
# 5. 임베딩 (워크플로우 템플릿 검색)
# -----------------------------------------------------------------------------

# [공통] none = 모델이 template을 읽고 고름(단어 매칭 아님) | openai = 게이트웨이 임베딩 | mock = 로컬용 해시 n-gram.
# openai 면 EMBEDDING_BASE_URL, EMBEDDING_MODEL 필수.
EMBEDDING_PROVIDER: none

# [공통] 임베딩 API 주소 (openai 일 때). 예) http://model.frodo.com/v1
EMBEDDING_BASE_URL: ""

# [공통][비밀] 임베딩 API 키. 필요 없으면 EMPTY.
EMBEDDING_API_KEY: EMPTY

# [공통] 임베딩 모델 이름 (openai 일 때). 예) bge-m3
EMBEDDING_MODEL: ""

# [공통] 임베딩 차원. 모델/차원이 바뀌면 다른 벡터 공간으로 취급해 섞지 않음.
EMBEDDING_DIMS: 1024

# [공통] 요청에 dimensions(=EMBEDDING_DIMS)를 실어 보낼지. 마트로시카 모델(text-embedding-3-*)만 지원하고
# bge-m3 등은 400 "dimensions is currently not supported"를 내므로 기본 false.
# false 면 모델 자체 차원이 EMBEDDING_DIMS 와 같아야 함 (scripts/check_embedding.* 로 확인).
EMBEDDING_SEND_DIMENSIONS: false


# -----------------------------------------------------------------------------
# 6. Executor (코드 실행 서비스)
# -----------------------------------------------------------------------------

# [환경별] executor API 주소 (/api/v1 앞까지). 기본값: http://localhost:8000
EXECUTOR_BASE_URL: http://<executor-host>:8000

# [환경별][비밀] executor 에서 발급받은 우리 키(X-Api-Key, relay 키).
# APP_ENV 가 있으면 필수. 자리표시자가 남아 있으면 기동 거부. 기본값: ""
EXECUTOR_API_KEY: <exe-key>

# [환경별][비밀] executor 운영(runtime/maintenance) API 키. 시스템 페이지의
# 런타임 화면용. 비우면 그 화면이 503. 기본값: ""
EXECUTOR_ADMIN_API_KEY: ""

# [공통] executor 상의 이 서비스 tenant id (소문자/숫자/-, 3~64자, dlq/work 금지).
# 우리 실행 이벤트는 <EXECUTOR_EVENT_STREAM>.<tenant> 스트림으로 옴.
# 공용 executor 에서 로컬 실행을 분리하려면 로컬만 다른 값(예: dtest-agent-local).
EXECUTOR_TENANT_ID: dtest-agent-service

# [공통] executor 입력 PV 위의 이 서비스 폴더가 이 pod 에 마운트된 경로.
# executor 로 보내는 코드는 <root>/sources/ 아래에 씀. 기본값: .local/shared/agentic
STORAGE_ROOT: /mnt/data/dtest/dtest-agent-service

# [공통] 같은 폴더를 executor 의 INPUT_STORAGE_ROOT 기준 상대 경로로 쓴 값.
# 기본값: agentic
STORAGE_EXECUTOR_PATH: dtest-agent-service

# [공통] executor 가 결과 경로(result_ref, manifest)를 상대경로로 주는 기준 루트(모든
# 서비스 공통 루트)가 이 pod 에 마운트된 경로. 받은 경로를 이 루트에 그대로 붙여 읽음
# (예: executor/executions/...). 기본값: .local/shared
EXECUTOR_RESULT_ROOT: /mnt/data/dtest

# [공통] executor 의 REDIS_EVENT_STREAM (tenant 스트림 이름의 접두어).
EXECUTOR_EVENT_STREAM: executor.events

# [공통] 이벤트를 이만큼(초) 못 받고 기다리는 실행은 executor API 로 상태를 직접 조회해 복구.
EXECUTOR_EVENT_RECOVERY_SECONDS: 120

# [공통] executor 에 요청하는 런타임 프로필 이름.
EXECUTOR_RUNTIME_PROFILE: default

# [공통] executor 작업(실행 등) 완료를 기다리는 최대 시간(초, 30 이상).
EXECUTOR_OPERATION_WAIT_SECONDS: 1800

# [공통] 분석 스텝 하나의 실행 제한 시간(초). null 이면 보내지 않음(executor 기본값).
EXECUTOR_STEP_TIMEOUT_SECONDS: null

# [공통] executor HTTP 호출 하나의 타임아웃(초).
EXECUTOR_TIMEOUT_SECONDS: 30.0

# [공통] pv = 공유 PV 로 코드/결과 주고받음(운영) | api = PV 없이 INLINE 코드 +
# 노트북 API 로 결과 조회 (테스트 전용, stg/prd 금지, .env.testmode.example 참고)
EXECUTOR_IO_MODE: pv


# -----------------------------------------------------------------------------
# 7. JupyterLab 링크 (executor 노트북/리포트 열기)
# -----------------------------------------------------------------------------

# [공통] executor JupyterLab 주소. 비우면 "JupyterLab에서 열기" 링크 없음. 기본값: ""
NOTEBOOK_LAB_BASE_URL: https://executor-jupyter-lab.frodo.com

# [공통] Jupyter 루트와 executor 공유 루트가 다를 때 그 사이 경로. 예) shared
NOTEBOOK_LAB_PATH_PREFIX: ""

# [공통] 사용자별 Jupyter 워크스페이스 이름 접두어.
NOTEBOOK_LAB_WORKSPACE_PREFIX: agentic-


# -----------------------------------------------------------------------------
# 8. 에이전트 자산 (skill / tool / knowledge 카탈로그)
# -----------------------------------------------------------------------------

# [공통] 기본 카탈로그 폴더 (main 브랜치: assets/...).
SKILLS_ROOT: src/dtest/assets/skills
TOOLS_ROOT: src/dtest/assets/tools
KNOWLEDGE_ROOT: src/dtest/assets/knowledge

# [공통] 기본 카탈로그 위에 얹는 추가 카탈로그 목록(각각 skills/, tools/,
# knowledge/ 포함, 없어도 됨). 뒤의 것이 같은 이름을 대체. 빼면 기본으로 돌아감.
# 예) ["src/dtest/catalogs/analysis_test"]
CATALOG_EXTENSIONS: []


# -----------------------------------------------------------------------------
# 9. 에이전트 동작
# -----------------------------------------------------------------------------

# [공통] 에이전트가 직접 코드를 쓸 수 있는 정도의 기본값 (1~4). 세션 > 프로젝트 값이 우선.
#   1 tools_only        등록된 tool 선택과 인자만 (run_custom_code 불가)
#   2 tools_with_glue   tool 사이 짧은 연결 코드(컬럼 선택, 형변환, 필터)만
#   3 tools_first       tool 우선, 맞는 tool 이 없거나 실패를 메울 때 새 함수 작성
#   4 free_code         tool 은 참고만, 필요한 코드를 자유롭게 작성
DEFAULT_CODE_LEVEL: 3

# [공통] 계획 승인 카드에 내는 후보 수 (1~10).
PLAN_CANDIDATES: 5

# [공통] 워크플로우 템플릿을 추천 후보로 올리는 최소 유사도.
WORKFLOW_SIMILARITY: 0.70

# [공통] 템플릿 추천 방식.
#   mixed           추천 템플릿 먼저 + 나머지는 새 계획, 한 카드에
#   recommend_first 추천 템플릿만 먼저(거절하면 새 계획), 맞는 게 없으면 새 계획만
# internal/gaia 는 mixed 유지 (gaia 브리지가 첫 후보를 자동 승인).
PLAN_RECOMMEND_MODE: mixed

# [공통] 후보가 템플릿 하나뿐이고 임베딩 유사도가 이 값 이상이면 승인 카드 없이 바로 실행
# (임베딩 없이 모델이 고른 검색일 때는 안 함). WORKFLOW_SIMILARITY 이상이어야 함.
WORKFLOW_AUTO_RUN_SIMILARITY: 0.77

# [공통] 후보 워크플로우를 전체 사용자용 템플릿으로 승격할 수 있는 사람.
# author = 작성자 본인 | admin = 관리자만
WORKFLOW_PROMOTION: author

# [공통] LangGraph recursion_limit (한 턴의 그래프 스텝 상한).
AGENT_RECURSION_LIMIT: 200

# [공통] 한 턴의 모델 호출 상한 (실패를 반복하는 모델 차단).
# executor 대기, 승인 대기를 거쳐 이어져도 한 턴으로 셈.
AGENT_MODEL_CALL_LIMIT: 40

# [공통] 한 턴에서 같은 도구가 같은 오류로 연속 이만큼 실패하면 다시 실행하지 않음 (1 이상).
AGENT_TOOL_FAILURE_LIMIT: 3

# [공통] 한 턴에서 같은 도구가 오류 내용과 상관없이 연속 이만큼 실패하면
# 다시 실행하지 않음 (1 이상). 실행 실패(run_plan, run_custom_code)는
# 코드를 고칠 때마다 오류 문구가 달라지므로 이 값으로 멈춤.
AGENT_TOOL_FAILURE_ANY_LIMIT: 5

# [공통] 채팅 턴 안에서 분석 리포트를 쓰는 리포트 에이전트의 모델 호출 상한
# (read_step + submit_report, 2 이상). 사용자가 턴 안에서 기다림.
REPORT_MODEL_CALL_LIMIT: 8

# [공통] 스텝 결과가 이 글자 수 안이면 리포트 작성자에게 통째로 전달,
# 넘으면 잘라서 read_step 으로 읽게 함 (10000 이상).
REPORT_EVIDENCE_MAX_CHARS: 60000

# [공통] finish_analysis 로 분석이 끝나면 그 분석의 도구 결과를 줄여 컨텍스트 절약.
AGENT_COMPACT_FINISHED_ANALYSIS: true

# [공통] 대화 요약을 시작하는 추정 토큰 수 (4 글자 = 1 토큰 기준). 요약 후 절반 유지.
AGENT_SUMMARY_TRIGGER_TOKENS: 30000

# [공통] 요약문에 요청하는 최대 길이(글자).
AGENT_SUMMARY_MAX_CHARS: 6000


# -----------------------------------------------------------------------------
# 10. 프로젝트 메모리
# -----------------------------------------------------------------------------

# [공통] 프로젝트 하나의 메모리 주제별 글자 수 한도의 합 상한 (2200~20000).
# 기본 4 주제(개요/선호/관심사/주요 사건)가 500/500/500/700 = 2200.
MEMORY_TOTAL_MAX_CHARS: 2200

# [공통] 끝난 대화에서 사용자가 말한 지속 사실을 뽑는 백그라운드 작업 사용 여부.
# 꺼져 있어도 턴 수는 셈.
MEMORY_WORKER_ENABLED: true

# [공통] 프로젝트에 끝난 턴이 이만큼(초) 없으면 처리.
MEMORY_WORKER_QUIET_SECONDS: 180

# [공통] 또는 끝난 턴이 이만큼 쌓이면 처리 (1 이상).
MEMORY_WORKER_MAX_TURNS: 5

# [공통] LLM 호출 하나에 넣는 대화량(글자/4 토큰, 500 이상). 나머지는 다음 호출로.
MEMORY_WORKER_MAX_INPUT_TOKENS: 8000

# [공통] pod 하나에서 동시에 처리하는 프로젝트 수 (1 이상).
MEMORY_WORKER_CONCURRENCY: 1


# -----------------------------------------------------------------------------
# 11. 실행(run) 스케줄러
# -----------------------------------------------------------------------------

# [공통] pod 하나에서 동시에 도는 채팅 턴 수 (1 이상).
# 각 턴이 체크포인트를 쓰므로 CHECKPOINT_POOL_SIZE x 2 이하 권장.
RUN_CONCURRENCY: 16

# [공통] 사용자 한 명이 모든 pod 에 걸쳐 동시에 돌릴 수 있는 턴 수 (0 = 무제한).
RUN_USER_CONCURRENCY: 4

# [공통] 턴을 잡은 pod 의 lease 시간(초, 10 이상). 갱신이 끊기면 다른 pod 가 이어받음.
RUN_LEASE_SECONDS: 60

# [공통] 대기 턴 폴링 간격(초). 평소엔 Redis 로 깨우므로 대비용.
RUN_POLL_SECONDS: 5.0

# [공통] 일시정지 지점에 못 가고 다시 잡힌 횟수가 이만큼이면 실패 처리 (크래시 루프 방지).
RUN_MAX_ATTEMPTS: 5


# -----------------------------------------------------------------------------
# 12. 보존 기간 (일)
# -----------------------------------------------------------------------------

# [공통] 실행 이벤트(run events) 보존.
RUN_EVENT_RETENTION_DAYS: 30
# [공통] executor 이벤트 수신함 보존.
EXECUTOR_INBOX_RETENTION_DAYS: 7
# [공통] executor 로 보낸 코드 파일 보존 (executor 가 스냅샷하면 불필요).
CODE_SOURCE_RETENTION_DAYS: 7
# [공통] 삭제된 세션의 이미지 보존.
IMAGE_RETENTION_DAYS: 7
# [공통] run 생성 멱등키 보존.
RUN_REQUEST_RETENTION_DAYS: 1


# -----------------------------------------------------------------------------
# 13. 이미지 / 요청 크기 (비전 모델)
# -----------------------------------------------------------------------------

# [공통] 이미지 한 장 최대 크기(바이트). 10 MiB
IMAGE_MAX_BYTES: 10485760
# [공통] 한 턴의 이미지 합계 최대 크기(바이트). 20 MiB
IMAGE_MAX_TOTAL_BYTES: 20971520
# [공통] 요청 본문(Content-Length) 최대 크기, 넘으면 읽기 전에 413. 32 MiB.
# ingress 에도 별도 제한을 둘 것.
REQUEST_MAX_BYTES: 33554432
# [공통] 최근 몇 개 사용자 턴의 이미지까지 모델에 보낼지.
IMAGE_CONTEXT_TURNS: 3
# [공통] 대화 요약 시점을 정할 때 이미지 한 장을 몇 토큰으로 셀지.
# (LangChain 기본 85, 1568px 이미지는 실제 약 1~1.5k)
IMAGE_TOKENS: 1500
# [공통] 실행된 Step의 그림(플롯)을 비전 모델에 보여줄 최대 장수. 0이면 끔.
# 비전 모델(INPUT 에 image)이 아니면 항상 꺼지고, 모델의 MAX_IMAGES 를 넘지 않음.
# 분석 단계: 가장 최근 도구 결과의 그림을 보고 다음 Step을 정함.
AGENT_TOOL_IMAGES: 4
# 채팅 분석 리포트 작성 시.
REPORT_MAX_IMAGES: 6
# 배치 리포트 작성 시 (BATCH_REPORT_MODEL 기준).
BATCH_REPORT_MAX_IMAGES: 6


# -----------------------------------------------------------------------------
# 14. pr-batch (배치) / 배치 리포트
# -----------------------------------------------------------------------------

# [환경별] pr-batch API 주소. 기본값: http://localhost:8100
BATCH_BASE_URL: http://<pr-batch-host>:8100

# [환경별][비밀] pr-batch 에서 발급받은 우리 키(X-Api-Key, relay + admin).
# APP_ENV 가 있으면 필수. 기본값: ""
BATCH_API_KEY: <bat-key>

# [공통] 성공한 BATCH 실행의 리포트를 쓰는 모델. 비우면 기본 모델.
BATCH_REPORT_MODEL: ""

# [공통] 리포트 수집(COLLECTING) 단계가 executor 노트북 결과를 기다리는 최대 시간(초).
BATCH_REPORT_COLLECT_TIMEOUT_SECONDS: 1800

# [공통] 수집 단계 폴링 간격(초).
BATCH_REPORT_POLL_SECONDS: 10

# [공통] 리포트 에이전트가 참고하는 같은 배치의 이전 실행 요약 수 (0~50).
BATCH_REPORT_MEMORY_RUNS: 5

# [공통] 배치 리포트 하나의 모델 호출 상한.
BATCH_REPORT_MODEL_CALL_LIMIT: 20

# [공통] pod 하나가 동시에 쓰는 배치 리포트 수 (1 이상, RUN_CONCURRENCY 와 별개).
BATCH_REPORT_CONCURRENCY: 4

# [공통] execution.completed 를 못 받은 리포트 복구 주기(초, 60 이상).
BATCH_REPORT_RECOVERY_INTERVAL_SECONDS: 600

# [공통] 복구할 때 되돌아보는 기간(일, 1~90). 리포트 보존 기간은 이보다 길어야 함.
BATCH_REPORT_RECOVERY_LOOKBACK_DAYS: 14


# -----------------------------------------------------------------------------
# 15. Phoenix 트레이싱 (선택, docs/phoenix-tracing.md)
# -----------------------------------------------------------------------------
# gaia 템플릿과 같은 이름. gaia 는 자기 워크플로우 파일 안에서만 Phoenix 를
# 등록하므로, 우리 API/워커 run 은 이 설정으로 우리가 직접 등록해 보냄.

# [환경별] Phoenix 주소 (OTLP HTTP, /v1/traces 는 붙여 줌). 비우면 트레이싱 꺼짐.
# 기본값: ""
PHOENIX_ENDPOINT: http://<phoenix-host>

# [환경별][비밀] Phoenix API 키. 필요할 때만. 기본값: ""
PHOENIX_API_KEY: <phoenix-key>

# [환경별] Phoenix 프로젝트 이름(트레이스가 모이는 곳). 기본값: pr-agentic-service
# 예) 로컬은 pr-agentic-service-local
SERVICE_ID: pr-agentic-service


# =============================================================================
# 부록 A. 환경변수로만 읽는 값 (설정 파일에 써도 무시됨)
# =============================================================================
# APP_ENV                      dev | stg | prd. 읽을 config.{APP_ENV}.yml 선택.
#                              비우면 local (k8s 에서 비어 있으면 기동 거부).
#                              Deployment env: 또는 Dockerfile --build-arg APP_ENV=...
# RUN_MODE                     all(기본, API + 워커 한 프로세스) | api | worker (src/dtest/entry.py)
# PORT                         internal/gaia 전용: 로컬 진입점(src/dtest/local.py) 포트, 기본 8080
# KUBERNETES_SERVICE_HOST      k8s 가 자동으로 넣음 (APP_ENV 누락 검사에 사용, 직접 설정 X)
#
# =============================================================================
# 부록 B. docker-compose.yml / .env 의 로컬 전용 치환 변수 (Settings 아님)
# =============================================================================
# APP_PORT             호스트에 여는 포트. 기본 8080
# PG_USER, PG_PASSWORD, PG_DB
#                      공유 Postgres 계정/DB 이름 (DATABASE_URL 을 만드는 데 씀).
#                      기본 executor / executor / agentic
# EXECUTOR_SHARED_DIR  executor 공유 폴더의 호스트 경로. 기본 ../executor/shared_dir
# LLM_API_KEY, EXECUTOR_API_KEY, EXECUTOR_ADMIN_API_KEY, BATCH_API_KEY,
# PHOENIX_ENDPOINT, PHOENIX_API_KEY, SERVICE_ID
#                      compose 가 .env 에서 받아 컨테이너 환경변수로 넘김
#
# 스크립트 (scripts/run_scenarios.py, scripts/seed_test_workflows.py)
# BASE_URL             대상 서비스 주소. 기본 http://localhost:8080
