# Standard logging.dictConfig used when the internal HCP library is absent
# (src/dtest/core/logging_setup.py). Inside the company network HCP's
# init_logger() reads its own logger.yml; replace this file with that one
# when moving the code in.
version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s %(levelname)s %(name)s [%(request_id)s]: %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    stream: ext://sys.stdout

root:
  level: INFO
  handlers: [console]

loggers:
  # One INFO line per LLM/executor call is load.
  httpx:
    level: WARNING
  httpx2:
    level: WARNING
  openai:
    level: WARNING
  # uvicorn keeps its own handlers with propagate off unless reset here.
  uvicorn:
    handlers: []
    propagate: true
  uvicorn.error:
    handlers: []
    propagate: true
  uvicorn.access:
    level: INFO
    handlers: []
    propagate: true
