[project]
name = "pr-agentic-service"
version = "0.1.0"
description = "Agentic data-analysis service: User/Project/Session API and LangGraph agents"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.20.0",
    # <0.137: from 0.137 included routers are lazy _IncludedRouter routes
    # without .path, which prometheus-fastapi-instrumentator (the gaia
    # template's Instrumentor) reads on every request.
    "fastapi>=0.115,<0.137",
    "httpx>=0.28.1",
    "json-repair>=0.64.0",
    "jsonschema>=4.26.0",
    "langchain>=1.4.5",
    "langchain-openai>=1.7.1",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-postgres>=3.1.3",
    "pgvector>=0.5.1",
    "pillow>=12.3.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "redis>=5,<6",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
    # Company network: HCP (hcp.framework) and the gaia template's base
    # requirements go here.
]

# Not installed as a package: the gaia template's app.py runs from the repo
# root and imports src.dtest.* (src/dtest/local.py outside the network).
[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 79
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]
phoenix = [
    "arize-phoenix-otel>=0.17.2",
    "openinference-instrumentation-langchain>=0.1.79",
]
# runs the test catalog's tools in tests (src/dtest/catalogs/)
catalog-test = [
    "matplotlib>=3.10",
    "numpy>=2.2",
    "pandas>=2.3",
    "scikit-learn>=1.7",
    "scipy>=1.15",
    "statsmodels>=0.14",
]

[tool.ty.environment]
python-version = "3.11"
extra-paths = [".", "scripts"]

# src/dtest/assets/ and src/dtest/catalogs/ tools run in the executor's Jupyter kernel, whose
# packages are not in this venv.
[[tool.ty.overrides]]
include = ["src/dtest/assets/**", "src/dtest/catalogs/**"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
