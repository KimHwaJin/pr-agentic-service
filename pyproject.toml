[project]
name = "pr-agentic-service"
version = "0.1.0"
description = "Agentic data-analysis service: User/Project/Session API and LangGraph agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "json-repair>=0.64.0",
    "jsonschema>=4.26.0",
    "langchain>=1.4.5",
    "langchain-openai>=1.7.1",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-postgres>=3.1.3",
    "pgvector>=0.5.1",
    "pillow>=12.3.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.3",
    "redis>=5,<6",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["core", "api_service", "agent", "worker"]

[tool.ruff]
target-version = "py312"
line-length = 79
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]
phoenix = [
    "arize-phoenix-otel>=0.17.2",
    "openinference-instrumentation-langchain>=0.1.79",
]

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["src", "scripts"]

# assets/tools run in the executor's Jupyter kernel, whose packages are not in this venv.
[[tool.ty.overrides]]
include = ["assets/**"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
