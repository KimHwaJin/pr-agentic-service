<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배치 스크립트 노트북</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #faf9f5; --panel: #ffffff; --ink: #1f1e1d; --muted: #6f6b63; --faint: #a19d94;
    --line: #e6e2d8; --hover: #ece8de; --code: #f4f2ec; --ok: #2f7d4f; --bad: #b42318;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #262624; --panel: #30302e; --ink: #f2f0e9; --muted: #b5b1a8; --faint: #8a867e;
    --line: #3d3d3a; --hover: #353532; --code: #2b2b29;
  } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .meta { font-size: 12.5px; color: var(--muted); margin-bottom: 18px; }
  .meta a { color: inherit; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .cell { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; overflow: hidden; background: var(--panel); }
  .cell.skip { opacity: .65; }
  .head { display: flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: 12px; color: var(--faint); background: var(--hover); }
  .badge { margin-left: auto; font-size: 11px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .badge.ok { color: var(--ok); border-color: currentColor; }
  pre { margin: 0; padding: 10px 12px; font-size: 13px; overflow: auto; background: var(--code); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .md { padding: 4px 16px; }
  .out { border-top: 1px dashed var(--line); }
  .out pre { background: transparent; color: var(--muted); }
  .out img { max-width: 100%; display: block; padding: 8px 12px; }
  .state { color: var(--faint); }
</style>
</head>
<body>
<main>
  <h1 id="title">불러오는 중…</h1>
  <div class="meta" id="meta"></div>
  <div id="cells"></div>
</main>
<script>
// /dev/notebook.html?script=<id>&version=<id>: a pr-batch script version's notebook
const API = '/api/v1';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = s => marked.parse(esc(s));
const text = v => Array.isArray(v) ? v.join('') : (v ?? '');
const params = new URLSearchParams(location.search);
const script = params.get('script'), version = params.get('version');

async function get(path) {
  const r = await fetch(API + path, { credentials: 'include' });
  if (r.status === 401) { location.href = `${API}/auth/login/sso?return_to=/dev/`; throw new Error('login'); }
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
function output(o) {
  if (o.output_type === 'stream') return `<pre>${esc(text(o.text))}</pre>`;
  if (o.output_type === 'error') return `<pre style="color:var(--bad)">${esc(`${o.ename}: ${o.evalue}`)}</pre>`;
  const data = o.data || {};
  if (data['image/png']) return `<img alt="" src="data:image/png;base64,${text(data['image/png']).trim()}">`;
  return data['text/plain'] ? `<pre>${esc(text(data['text/plain']))}</pre>` : '';
}
(async () => {
  try {
    const base = `/batch/scripts/${encodeURIComponent(script)}/versions/${encodeURIComponent(version)}`;
    const [info, detail, nb] = await Promise.all([get(`/batch/scripts/${encodeURIComponent(script)}`), get(base), get(`${base}/content`)]);
    document.title = `${info.name} v${detail.version_number}`;
    $('title').textContent = `${info.name} · v${detail.version_number}`;
    const c = detail.cells;
    $('meta').innerHTML = `${esc(detail.filename)} · 셀 ${c.total}개 · 실행 ${c.executable} · 건너뜀 ${c.skipped} (마크다운·raw·빈 코드 셀은 실행하지 않습니다) · <span class="mono">sha256 ${esc(detail.sha256.slice(0, 12))}</span> · ${(detail.size_bytes / 1024).toFixed(1)}KB · <a href="${API}${base}/content" target="_blank">원본 파일</a>`;
    const marks = Object.fromEntries(detail.cell_list.map(m => [m.index, m]));
    $('cells').innerHTML = nb.cells.map((cell, i) => {
      const m = marks[i] || {};
      const badge = m.executed ? `<span class="badge ok">Step ${m.sequence}</span>` : '<span class="badge">건너뜀</span>';
      const body = cell.cell_type === 'markdown' ? `<div class="md">${md(text(cell.source))}</div>` : `<pre>${esc(text(cell.source)) || '<span class="state">(빈 셀)</span>'}</pre>`;
      const outs = (cell.outputs || []).map(output).join('');
      return `<section class="cell ${m.executed ? '' : 'skip'}"><div class="head">#${i} · ${esc(cell.cell_type)}${badge}</div>${body}${outs ? `<div class="out">${outs}</div>` : ''}</section>`;
    }).join('') || '<div class="state">빈 노트북입니다.</div>';
  } catch (e) {
    $('title').textContent = '노트북을 불러오지 못했습니다';
    $('meta').textContent = e.message;
  }
})();
</script>
</body>
</html>
