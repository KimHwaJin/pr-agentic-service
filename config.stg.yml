# APP_ENV=stg: the values that differ per environment, on top of config.yml
# (shared; every other key is there).
# Fill the <...> values; environment variables (Deployment env:) win.
DATABASE_URL: postgresql+psycopg://<user>:<password>@<pg-host>:5432/agentic
REDIS_URL: redis://<redis-host>:6379/0

PUBLIC_API_ORIGIN: https://<api-host>
FRONTEND_ORIGIN: https://<front-host>
CORS_ORIGINS: ["https://<front-host>"]
# SSO login page origin(s) (scheme://host); empty = every login 502.
# A refused one is logged as sso_login_url_rejected origin=...
SSO_ALLOWED_ORIGINS: ["https://<sso-host>"]
COOKIE_SECURE: true

# employee ids with the admin role, as SSO sends them; given at a user's
# first login only, so fill before the administrators first log in
ADMIN_EMPLOYEE_IDS: []

LLM_API_KEY: <llm-api-key>

EXECUTOR_BASE_URL: http://<executor-host>:8000
# Our keys at the executor (relay) and its operator key (시스템 page
# runtime views; may stay empty). Secrets: better as Deployment env.
EXECUTOR_API_KEY: <exe-key>
EXECUTOR_ADMIN_API_KEY: ""

BATCH_BASE_URL: http://<pr-batch-host>:8100
# Our key at pr-batch (relay + admin). Secret: better as Deployment env.
BATCH_API_KEY: <bat-key>

# Models served in this environment (fill in): name = served model name,
# input: [text] or [text, image] as the deployed model supports.
MODELS:
  - NAME: <model-name>
    LABEL: <display name>
    DEFAULT: true
    INPUT: [text]

# Phoenix tracing (docs/phoenix-tracing.md); empty endpoint = off. The gaia
# template's names: the Deployment env may set them for both. Key: secret.
PHOENIX_ENDPOINT: ""
PHOENIX_API_KEY: ""
SERVICE_ID: pr-agentic-service-stg
