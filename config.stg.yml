# APP_ENV=stg: the values that differ per environment, on top of config.yml
# (shared; every other key is there).
# Fill the <...> values; environment variables (Deployment env:) win.
DATABASE_URL: postgresql+psycopg://<user>:<password>@<pg-host>:5432/agentic
REDIS_URL: redis://<redis-host>:6379/0

PUBLIC_API_ORIGIN: https://<api-host>
FRONTEND_ORIGIN: https://<front-host>
CORS_ORIGINS: ["https://<front-host>"]
COOKIE_SECURE: true

# employee ids with the admin role
ADMIN_EMPLOYEE_IDS: []

LLM_API_KEY: <llm-api-key>

EXECUTOR_BASE_URL: http://<executor-host>:8000

BATCH_BASE_URL: http://<pr-batch-host>:8100

# Models served in this environment (fill in): name = served model name,
# input: [text] or [text, image] as the deployed model supports.
MODELS:
  - NAME: <model-name>
    LABEL: <display name>
    DEFAULT: true
    INPUT: [text]
