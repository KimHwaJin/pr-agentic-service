<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="420" viewBox="0 0 1500 420" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','WenQuanYi Zen Hei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="1500" height="420" fill="#ffffff"/>
<text x="40" y="38" font-size="18" font-weight="bold">프로젝트 메모리 추출 흐름 (AW-05)</text>
<rect x="40" y="90" width="300" height="80" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="190.0" y="118.0" font-size="12" text-anchor="middle" font-weight="bold">턴 종료</text>
<text x="190.0" y="134.2" font-size="10" text-anchor="middle">RunScheduler가 프로젝트를</text>
<text x="190.0" y="150.4" font-size="10" text-anchor="middle">dirty로 표시, pending_turns 증가</text>
<rect x="400" y="90" width="300" height="80" rx="6" fill="#ffffff" stroke="#999999"/>
<text x="550.0" y="118.0" font-size="12" text-anchor="middle" font-weight="bold">대기</text>
<text x="550.0" y="134.2" font-size="10" text-anchor="middle">대화가 180초 조용하거나</text>
<text x="550.0" y="150.4" font-size="10" text-anchor="middle">5턴이 쌓일 때까지</text>
<rect x="760" y="90" width="300" height="80" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="910.0" y="118.0" font-size="12" text-anchor="middle" font-weight="bold">작업 잡기</text>
<text x="910.0" y="134.2" font-size="10" text-anchor="middle">MemoryWorker가 lease 획득</text>
<text x="910.0" y="150.4" font-size="10" text-anchor="middle">(FOR UPDATE SKIP LOCKED)</text>
<rect x="1120" y="90" width="300" height="80" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="1270.0" y="118.0" font-size="12" text-anchor="middle" font-weight="bold">메시지 읽기</text>
<text x="1270.0" y="134.2" font-size="10" text-anchor="middle">커서 뒤의 user, assistant</text>
<text x="1270.0" y="150.4" font-size="10" text-anchor="middle">메시지 (최대 8,000 토큰)</text>
<rect x="40" y="240" width="300" height="80" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
<text x="190.0" y="268.0" font-size="12" text-anchor="middle" font-weight="bold">LLM 1회 호출</text>
<text x="190.0" y="284.2" font-size="10" text-anchor="middle">prompts/memory_worker.md</text>
<text x="190.0" y="300.4" font-size="10" text-anchor="middle">주제별 줄 편집을 제안</text>
<rect x="400" y="240" width="300" height="80" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="550.0" y="268.0" font-size="12" text-anchor="middle" font-weight="bold">코드 검증</text>
<text x="550.0" y="284.2" font-size="10" text-anchor="middle">인용이 사용자 메시지에 있는지,</text>
<text x="550.0" y="300.4" font-size="10" text-anchor="middle">URL·경로·제목이 없는지, id 존재</text>
<rect x="760" y="240" width="300" height="80" rx="6" fill="#fff2cc" stroke="#d6b656"/>
<text x="910.0" y="268.0" font-size="12" text-anchor="middle" font-weight="bold">반영</text>
<text x="910.0" y="284.2" font-size="10" text-anchor="middle">store에 쓰고 memory_history 기록</text>
<text x="910.0" y="300.4" font-size="10" text-anchor="middle">커서 전진, memory_updated 이벤트</text>
<text x="40" y="393.9" font-size="11" text-anchor="start">사용자가 직접 말한 오래 갈 사실, 선호, 관심사, 일정만 남깁니다. 검증에 실패한 편집은 버리고 나머지는 반영합니다. 계속 실패하는 구간은 건너뜁니다.</text>
