<path d="M700.0,130.0 L760.0,130.0" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arr)"/>
<path d="M1060.0,130.0 L1120.0,130.0" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arr)"/>
<path d="M1270.0,170.0 L1270.0,205.0 L190.0,205.0 L190.0,240.0" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arr)"/>
<path d="M340.0,280.0 L400.0,280.0" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arr)"/>
<path d="M700.0,280.0 L760.0,280.0" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arr)"/>
