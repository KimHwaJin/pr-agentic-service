<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="480" viewBox="0 0 1500 480" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','WenQuanYi Zen Hei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="1500" height="480" fill="#ffffff"/>
<text x="40" y="38" font-size="18" font-weight="bold">배치 리포트 작성 흐름 (AW-04)</text>
<rect x="40" y="90" width="200" height="56" rx="6" fill="#d5e8d4" stroke="#82b366"/>
<text x="140.0" y="113.8" font-size="13" text-anchor="middle" font-weight="bold">배치 실행 성공 이벤트</text>
<text x="140.0" y="131.3" font-size="11" text-anchor="middle">executor가 Redis 스트림에 씀</text>
<rect x="40" y="200" width="200" height="56" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="140.0" y="215.0" font-size="13" text-anchor="middle" font-weight="bold">작업 등록</text>
<text x="140.0" y="232.6" font-size="11" text-anchor="middle">ExecutorEventConsumer</text>
<text x="140.0" y="250.1" font-size="11" text-anchor="middle">키 batch-report:{execution_id}</text>
<rect x="40" y="320" width="200" height="56" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="140.0" y="335.0" font-size="13" text-anchor="middle" font-weight="bold">누락 복구</text>
<text x="140.0" y="352.6" font-size="11" text-anchor="middle">BatchReportRecovery</text>
<text x="140.0" y="370.1" font-size="11" text-anchor="middle">(10분마다, 최근 14일)</text>
<rect x="300" y="178" width="195" height="100" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
<text x="397.5" y="224.1" font-size="12" text-anchor="middle" font-weight="bold">QUEUED</text>
<text x="397.5" y="240.3" font-size="10" text-anchor="middle">대기</text>
<rect x="535" y="178" width="195" height="100" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
<text x="632.5" y="207.9" font-size="12" text-anchor="middle" font-weight="bold">COLLECTING</text>
<text x="632.5" y="224.1" font-size="10" text-anchor="middle">executor에서 실행 결과와</text>
<text x="632.5" y="240.3" font-size="10" text-anchor="middle">노트북을 모음.</text>
<text x="632.5" y="256.5" font-size="10" text-anchor="middle">준비될 때까지 대기</text>
<rect x="770" y="178" width="195" height="100" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
<text x="867.5" y="199.8" font-size="12" text-anchor="middle" font-weight="bold">GENERATING</text>
<text x="867.5" y="216.0" font-size="10" text-anchor="middle">리포트 Agent 실행</text>
<text x="867.5" y="232.2" font-size="10" text-anchor="middle">prompts/batch_analyst.md</text>
<text x="867.5" y="248.4" font-size="10" text-anchor="middle">read_step, submit_report</text>
<text x="867.5" y="264.6" font-size="10" text-anchor="middle">이전 실행 요약 참고</text>
<rect x="1005" y="178" width="195" height="100" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
<text x="1102.5" y="207.9" font-size="12" text-anchor="middle" font-weight="bold">MATERIALIZING</text>
<text x="1102.5" y="224.1" font-size="10" text-anchor="middle">리포트를 executor</text>
<text x="1102.5" y="240.3" font-size="10" text-anchor="middle">Artifact로 저장.</text>
<text x="1102.5" y="256.5" font-size="10" text-anchor="middle">이번 실행 요약을 기억</text>
<rect x="1240" y="178" width="195" height="100" rx="6" fill="#d5e8d4" stroke="#82b366"/>
<text x="1337.5" y="224.1" font-size="12" text-anchor="middle" font-weight="bold">SUCCEEDED</text>
<text x="1337.5" y="240.3" font-size="10" text-anchor="middle">끝</text>
<rect x="770" y="350" width="195" height="50" rx="6" fill="#f8cecc" stroke="#b85450"/>
<text x="867.5" y="371.1" font-size="12" text-anchor="middle" font-weight="bold">FAILED</text>
<text x="867.5" y="387.3" font-size="10" text-anchor="middle">failed_stage에 실패한 단계</text>
<text x="40" y="443.9" font-size="11" text-anchor="start">채팅 run 큐를 거치지 않습니다. 세션, 프로젝트, 체크포인트가 없고 재시도하면 Agent를 처음부터 다시 실행합니다. 진행 이벤트는 채팅과 같은 형식으로 작업별 스트림에 보냅니다.</text>
