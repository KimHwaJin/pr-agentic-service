<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1010" viewBox="0 0 1400 1010" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','WenQuanYi Zen Hei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="1400" height="1010" fill="#ffffff"/>
<text x="40" y="38" font-size="18" font-weight="bold">채팅 Agent Graph 한 바퀴 (middleware 훅 순서)</text>
<rect x="470" y="70" width="460" height="44" rx="20" fill="#ffe6cc" stroke="#d79b00"/>
<text x="700.0" y="87.8" font-size="13" text-anchor="middle" font-weight="bold">턴 시작</text>
<text x="700.0" y="105.3" font-size="11" text-anchor="middle">사용자 메시지 추가, 또는 멈춘 지점에서 재개 (Command resume)</text>
<rect x="470" y="150" width="460" height="60" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="700.0" y="167.0" font-size="13" text-anchor="middle" font-weight="bold">before_agent</text>
<text x="700.0" y="184.6" font-size="11" text-anchor="middle">Persona: 프로젝트 메모리 불러오기, nudges·notice 초기화</text>
<text x="700.0" y="202.1" font-size="11" text-anchor="middle">TurnModelCallLimit: 새 턴이면 호출 수 초기화</text>
<rect x="470" y="250" width="460" height="60" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="700.0" y="267.0" font-size="13" text-anchor="middle" font-weight="bold">before_model</text>
<text x="700.0" y="284.6" font-size="11" text-anchor="middle">TurnModelCallLimit: 한 턴 모델 호출 40회 넘었는지 확인</text>
<text x="700.0" y="302.1" font-size="11" text-anchor="middle">Summarization: 3만 토큰(어림) 넘으면 앞부분 요약</text>
<rect x="470" y="350" width="460" height="110" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="700.0" y="365.7" font-size="13" text-anchor="middle" font-weight="bold">wrap_model_call</text>
<text x="700.0" y="383.2" font-size="11" text-anchor="middle">Persona: 담당자(active_agent)의 프롬프트 렌더</text>
<text x="700.0" y="400.8" font-size="11" text-anchor="middle">+ 프로젝트 지침 + 프로젝트 메모리</text>
<text x="700.0" y="418.3" font-size="11" text-anchor="middle">담당자의 도구만 남김, 다른 담당자가 읽은 자료는 가림</text>
<text x="700.0" y="435.9" font-size="11" text-anchor="middle">이미지 참조를 실제 이미지로 바꿈</text>
<text x="700.0" y="453.4" font-size="11" text-anchor="middle">ToolCallDedup: 응답 안의 중복 도구 호출 정리</text>
<rect x="470" y="500" width="460" height="44" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
<text x="700.0" y="517.8" font-size="13" text-anchor="middle" font-weight="bold">model 노드</text>
<text x="700.0" y="535.3" font-size="11" text-anchor="middle">LLM 게이트웨이 호출 (토큰은 50ms 묶음으로 SSE 전달)</text>
<rect x="470" y="584" width="460" height="44" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="700.0" y="601.8" font-size="13" text-anchor="middle" font-weight="bold">after_model</text>
<text x="700.0" y="619.3" font-size="11" text-anchor="middle">Persona: 분석 담당이 도구 없이 글만 냈는지 확인</text>
<path d="M700.0,668 L780,713.0 L700.0,758 L620,713.0 z" fill="#ffffff" stroke="#999999"/>
<text x="700.0" y="709.1" font-size="12" text-anchor="middle" font-weight="bold">도구 호출이</text>
<text x="700.0" y="725.3" font-size="12" text-anchor="middle" font-weight="bold">있는가</text>
<rect x="470" y="810" width="460" height="44" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="700.0" y="827.8" font-size="13" text-anchor="middle" font-weight="bold">after_agent</text>
<text x="700.0" y="845.3" font-size="11" text-anchor="middle">Persona: active_agent를 main으로 되돌림</text>
<rect x="470" y="900" width="460" height="44" rx="20" fill="#ffe6cc" stroke="#d79b00"/>
<text x="700.0" y="917.8" font-size="13" text-anchor="middle" font-weight="bold">턴 끝</text>
<text x="700.0" y="935.3" font-size="11" text-anchor="middle">마지막 AI 메시지가 답 (message_final)</text>
<rect x="1010" y="500" width="340" height="130" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
<text x="1180.0" y="525.7" font-size="13" text-anchor="middle" font-weight="bold">tools 노드</text>
<text x="1180.0" y="543.2" font-size="11" text-anchor="middle">JsonArguments: 문자열로 온 JSON 인자 복구</text>
<text x="1180.0" y="560.8" font-size="11" text-anchor="middle">ToolFailureLimit: 같은 오류 연속 3회면 실행 중단</text>
<text x="1180.0" y="578.3" font-size="11" text-anchor="middle">도구 실행</text>
<text x="1180.0" y="595.9" font-size="11" text-anchor="middle">ToolError: 예외를 오류 메시지로 모델에 전달</text>
<text x="1180.0" y="613.4" font-size="11" text-anchor="middle">Compaction: finish_analysis 때 끝난 분석 결과 정리</text>
<rect x="1010" y="700" width="340" height="60" rx="20" fill="#f8cecc" stroke="#b85450"/>
<text x="1180.0" y="717.0" font-size="13" text-anchor="middle" font-weight="bold">그래프 멈춤</text>
<text x="1180.0" y="734.5" font-size="11" text-anchor="middle">interrupt: 승인 요청, 질문, executor 대기</text>
<text x="1180.0" y="752.1" font-size="11" text-anchor="middle">상태를 체크포인트에 저장, run은 waiting_*</text>
<rect x="60" y="668" width="330" height="90" rx="6" fill="#ffffff" stroke="#999999"/>
<text x="225.0" y="691.2" font-size="13" text-anchor="middle" font-weight="bold">분석 담당이 글만 냄</text>
<text x="225.0" y="708.8" font-size="11" text-anchor="middle">버리고 다시 시킴 (최대 2번)</text>
<text x="225.0" y="726.3" font-size="11" text-anchor="middle">그래도 멈추면 대화 담당이 넘겨받아</text>
<text x="225.0" y="743.9" font-size="11" text-anchor="middle">상황을 설명</text>
<text x="60" y="983.9" font-size="11" text-anchor="start">파랑: middleware 훅 / 보라: 그래프 노드 / 담당자(main, analyst)는 별도 그래프가 아니라 상태값 active_agent입니다.</text>
