<path d="M700.0,628.0 L700.0,668.0" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arr)"/>
<path d="M700.0,758.0 L700.0,810.0" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arr)"/>
<path d="M700.0,854.0 L700.0,900.0" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arr)"/>
