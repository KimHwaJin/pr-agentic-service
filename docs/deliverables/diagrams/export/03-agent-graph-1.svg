<rect x="641.1" y="776.0" width="117.8" height="16" fill="#ffffff"/>
<text x="700.0" y="788.0" font-size="11" text-anchor="middle" fill="#222">없음 (대화 담당의 답)</text>
<rect x="852.6" y="705.0" width="26.2" height="16" fill="#ffffff"/>
<text x="865.8" y="717.0" font-size="11" text-anchor="middle" fill="#222">있음</text>
<rect x="1036.9" y="272.0" width="162.2" height="16" fill="#ffffff"/>
<text x="1118.0" y="284.0" font-size="11" text-anchor="middle" fill="#222">도구 결과를 가지고 다시 모델로</text>
<rect x="1149.3" y="657.0" width="61.4" height="16" fill="#ffffff"/>
<text x="1180.0" y="669.0" font-size="11" text-anchor="middle" fill="#222">interrupt</text>
<rect x="452.3" y="705.0" width="105.4" height="16" fill="#ffffff"/>
<text x="505.0" y="717.0" font-size="11" text-anchor="middle" fill="#222">분석 담당이 글만 냄</text>
<rect x="312.0" y="272.0" width="62.8" height="16" fill="#ffffff"/>
<text x="343.4" y="284.0" font-size="11" text-anchor="middle" fill="#222">다시 모델로</text>
<rect x="1033.4" y="84.0" width="125.7" height="16" fill="#ffffff"/>
<text x="1096.2" y="96.0" font-size="11" text-anchor="middle" fill="#222">답이나 결과가 오면 재개</text>
