<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="700" viewBox="0 0 1480 700" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','WenQuanYi Zen Hei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="1480" height="700" fill="#ffffff"/>
<text x="40" y="38" font-size="18" font-weight="bold">장애 대응: 먼저 보는 순서</text>
<rect x="40" y="80" width="220" height="50" rx="20" fill="#ffe6cc" stroke="#d79b00"/>
<text x="150.0" y="109.5" font-size="13" text-anchor="middle" font-weight="bold">이상 신고 또는 알림</text>
<rect x="40" y="170" width="220" height="70" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="150.0" y="201.1" font-size="12" text-anchor="middle" font-weight="bold">1. 인스턴스 상태</text>
<text x="150.0" y="217.3" font-size="10" text-anchor="middle">떠 있는가, 재시작을 반복하는가</text>
<rect x="420" y="166" width="330" height="78" rx="6" fill="#f8cecc" stroke="#b85450"/>
<text x="585.0" y="184.9" font-size="12" text-anchor="middle" font-weight="bold">기동 로그 확인</text>
<text x="585.0" y="201.1" font-size="10" text-anchor="middle">ValueError, dtest_startup_failed</text>
<text x="585.0" y="217.3" font-size="10" text-anchor="middle">설정 검사, 마이그레이션, DB·Redis 접속</text>
<text x="585.0" y="233.5" font-size="10" text-anchor="middle">(운영자 메뉴얼 2.4, 4.4절)</text>
<rect x="40" y="270" width="220" height="70" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="150.0" y="301.1" font-size="12" text-anchor="middle" font-weight="bold">2. GET /api/v1/healthz</text>
<text x="150.0" y="317.3" font-size="10" text-anchor="middle">status 가 ok 인가</text>
<rect x="420" y="266" width="330" height="78" rx="6" fill="#f8cecc" stroke="#b85450"/>
<text x="585.0" y="284.9" font-size="12" text-anchor="middle" font-weight="bold">죽은 루프 확인</text>
<text x="585.0" y="301.1" font-size="10" text-anchor="middle">응답의 stopped 에 루프 이름</text>
<text x="585.0" y="317.3" font-size="10" text-anchor="middle">실행 환경이 인스턴스를 재시작함</text>
<text x="585.0" y="333.5" font-size="10" text-anchor="middle">반복되면 직전 예외 로그 (9.3절)</text>
<rect x="40" y="370" width="220" height="70" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="150.0" y="393.0" font-size="12" text-anchor="middle" font-weight="bold">3. 앱 로그</text>
<text x="150.0" y="409.2" font-size="10" text-anchor="middle">오류 ID, X-Request-ID,</text>
<text x="150.0" y="425.4" font-size="10" text-anchor="middle">로그 키워드로 검색</text>
<rect x="420" y="366" width="330" height="78" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="585.0" y="393.0" font-size="12" text-anchor="middle" font-weight="bold">증상별 대응표로 이동</text>
<text x="585.0" y="409.2" font-size="10" text-anchor="middle">로그 키워드 사전 (6.11절)</text>
<text x="585.0" y="425.4" font-size="10" text-anchor="middle">증상별 대응표 (6.3절)</text>
<rect x="40" y="470" width="220" height="70" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="150.0" y="501.1" font-size="12" text-anchor="middle" font-weight="bold">4. DB</text>
<text x="150.0" y="517.3" font-size="10" text-anchor="middle">run 상태 분포, 연결 수</text>
<rect x="420" y="466" width="330" height="78" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="585.0" y="493.0" font-size="12" text-anchor="middle" font-weight="bold">run, DB 대응</text>
<text x="585.0" y="509.2" font-size="10" text-anchor="middle">queued 적체, failed 증가 (6.5절)</text>
<text x="585.0" y="525.4" font-size="10" text-anchor="middle">연결 한도 (6.8절), 자주 쓰는 SQL (6.9절)</text>
<rect x="40" y="570" width="220" height="70" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="150.0" y="593.0" font-size="12" text-anchor="middle" font-weight="bold">5. 연결된 서비스</text>
<text x="150.0" y="609.2" font-size="10" text-anchor="middle">executor, pr-batch,</text>
<text x="150.0" y="625.4" font-size="10" text-anchor="middle">LLM 게이트웨이, Redis</text>
<rect x="420" y="566" width="330" height="78" rx="6" fill="#d5e8d4" stroke="#82b366"/>
<text x="585.0" y="584.9" font-size="12" text-anchor="middle" font-weight="bold">상대 서비스 확인</text>
<text x="585.0" y="601.1" font-size="10" text-anchor="middle">502 는 upstream_unreachable path 로 구분</text>
<text x="585.0" y="617.3" font-size="10" text-anchor="middle">분석이 안 끝나면 executor 대기 (6.6절)</text>
<text x="585.0" y="633.5" font-size="10" text-anchor="middle">시스템 화면의 런타임, 이벤트 스트림 (10장)</text>
<rect x="830" y="80" width="610" height="560" rx="8" fill="#fafafa" stroke="#999999" stroke-dasharray="6 4"/>
<text x="842" y="100" font-size="13" text-anchor="start" font-weight="bold">화면에서 바로 할 수 있는 조치 (시스템 탭, 관리자)</text>
<rect x="860" y="130" width="550" height="76" rx="6" fill="#ffffff" stroke="#999999"/>
<text x="1135.0" y="156.0" font-size="12" text-anchor="middle" font-weight="bold">런타임</text>
<text x="1135.0" y="172.2" font-size="10" text-anchor="middle">런타임별 CPU, 메모리, 실행 슬롯</text>
<text x="1135.0" y="188.4" font-size="10" text-anchor="middle">점검, 비우기, 활성화, 사용 중지</text>
<rect x="860" y="230" width="550" height="76" rx="6" fill="#ffffff" stroke="#999999"/>
<text x="1135.0" y="256.0" font-size="12" text-anchor="middle" font-weight="bold">런타임 커널</text>
<text x="1135.0" y="272.2" font-size="10" text-anchor="middle">커널별 메모리와 그 커널을 쓰는 실행</text>
<text x="1135.0" y="288.4" font-size="10" text-anchor="middle">실행 취소, 남겨진 커널 삭제</text>
<rect x="860" y="330" width="550" height="76" rx="6" fill="#ffffff" stroke="#999999"/>
<text x="1135.0" y="356.0" font-size="12" text-anchor="middle" font-weight="bold">점검</text>
<text x="1135.0" y="372.2" font-size="10" text-anchor="middle">새 실행 접수 중지와 재개</text>
<text x="1135.0" y="388.4" font-size="10" text-anchor="middle">진행 중 실행 멈추기</text>
<rect x="860" y="430" width="550" height="76" rx="6" fill="#ffffff" stroke="#999999"/>
<text x="1135.0" y="456.0" font-size="12" text-anchor="middle" font-weight="bold">이벤트 스트림</text>
<text x="1135.0" y="472.2" font-size="10" text-anchor="middle">tenant별 Redis 스트림 항목 수,</text>
<text x="1135.0" y="488.4" font-size="10" text-anchor="middle">consumer group 의 lag, pending</text>
<rect x="860" y="530" width="550" height="76" rx="6" fill="#ffffff" stroke="#999999"/>
<text x="1135.0" y="556.0" font-size="12" text-anchor="middle" font-weight="bold">사용자, API 키</text>
<text x="1135.0" y="572.2" font-size="10" text-anchor="middle">사용자 비활성화, 역할 변경</text>
<text x="1135.0" y="588.4" font-size="10" text-anchor="middle">키 발급, 재발급, 폐기</text>
<text x="40" y="673.9" font-size="11" text-anchor="start">절 번호는 운영자 메뉴얼의 절입니다. 이상 신호의 기준값은 7.2절에 있습니다.</text>
