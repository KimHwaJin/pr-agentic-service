<text x="60" y="591.4" font-size="11" text-anchor="start">점선: 제약 없이 값으로 참조. checkpoints.thread_id = sessions.id. checkpoint_blobs는 thread_id, checkpoint_ns와 checkpoints.checkpoint의 채널 버전으로, checkpoint_writes는 checkpoint_id까지 같은 값으로 찾습니다.</text>
<text x="60" y="606.3" font-size="11" text-anchor="start">store는 prefix에 project_memory.{project_id}, tool_effects.{run_id}, batch_memory.{batch_id}를 담아 값으로만 참조합니다. *_migrations와 alembic_version은 스키마 버전 기록이라 다른 테이블과 관계가 없습니다.</text>
