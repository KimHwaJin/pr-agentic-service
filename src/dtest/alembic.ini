[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/../..
# sqlalchemy.url comes from DATABASE_URL (src.dtest.core.config.Settings)

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
